name: CI

on:
  push:
    branches:
      - main
      - work
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show versions
        run: |
          node --version
          npm --version

      - name: Syntax check
        run: npm run check

      - name: Run tests
        run: npm test
